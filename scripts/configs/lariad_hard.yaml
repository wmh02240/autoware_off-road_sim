# LARIAD hard-scene smoke-test configuration (single vehicle).
physics_settings:
  time_steps_per_second: 100
  solver_position_iterations: 4
  solver_velocity_iterations: 1

graphics_settings:
  render_resolution: [1920, 1080]
  enable_DLSS_FPS_Multiplier_x2: false
  disable_shadows: false
  disable_ambient_occlusion: true
  disable_reflections: true

user_interface:
  viewport_mode: false
  default_control_mode: "KEYBOARD"
  split_screen: false

map_server:
  enabled: false

network_setup:
  ros2_domain_id: 0
  network_interface: "auto"
  ros2_cmd_timeout_s: 3.0

tf_settings:
  namespace_links: true
  # 使用显式 ROS 语义坐标系，避免把 CAD/PhysX 刚体原点直接作为 TF 原点。
  semantic_frames: true
  # 原始 USD 的 TransformTree 会把四个轮子刚体原点发布在车体原点；
  # P0 阶段先停用该错误 TF，P1 阶段再按轮轴中心重建动态车轮 TF。
  disable_builtin_transform_tree: true
  # 从轮胎视觉中心提取实时姿态，以较低频率发布四轮动态 TF。
  wheel_tf_rate_hz: 30.0
  publish_map_to_odom: true
  map_frame: "map"

environment:
  asset: "external_assets/lariad_offroad_nav/compat/hard.usda"
  scale: [1.0, 1.0, 1.0]
  rotation_euler: [0.0, 0.0, -179.6158]
  # launch_sim.py authors scale/rotate/translate in this order; this local
  # translation reproduces the source map's final world translation.
  translation: [-0.0089229767, 0.0000598346, 0.0]
  frictions:
    - name: "GeneratedTerrainMaterial"
      dynamic_friction: 0.45
      static_friction: 0.60
    - name: "TirePhysicsMaterial"
      dynamic_friction: 1.0
      static_friction: 1.0

vehicles:
  - name: "Ego_Vehicle"
    enabled: false
    asset: "assets/vehicles/roboracer_max.usd"
    topic_prefix: "/ego"
    spawn_position: [-0.3063, 23.3731, 0.15]
    spawn_orientation: [0.0, 0.0, -90.0]
    enable_camera: true
    enable_lidar: true
    enable_gnss: true
    ros_frames:
      base_footprint: "base_footprint"
      base_link: "base_link"
      chassis: "chassis_link"
      camera: "camera_color_frame"
      camera_optical: "camera_color_optical_frame"
      camera_left: "camera_left_frame"
      camera_left_optical: "camera_left_optical_frame"
      camera_right: "camera_right_frame"
      camera_right_optical: "camera_right_optical_frame"
      camera_depth: "camera_depth_frame"
      camera_depth_optical: "camera_depth_optical_frame"
      imu: "imu_link"
      realsense_imu: "realsense_imu_link"
      lidar: "lidar_link"
      front_left_wheel: "front_left_wheel_link"
      front_right_wheel: "front_right_wheel_link"
      rear_left_wheel: "rear_left_wheel_link"
      rear_right_wheel: "rear_right_wheel_link"

  - name: "Opponent_Vehicle"
    enabled: true
    asset: "assets/vehicles/roboracer_offroad.usd"
    topic_prefix: "/opponent"
    spawn_position: [-0.3063, 23.3731, 0.15]
    spawn_orientation: [0.0, 0.0, -90.0]
    enable_camera: true
    enable_lidar: true
    enable_gnss: true
    ros_frames:
      base_footprint: "base_footprint"
      base_link: "base_link"
      chassis: "chassis_link"
      camera: "zed_left_camera_frame"
      camera_optical: "zed_left_camera_optical_frame"
      camera_right: "zed_right_camera_frame"
      camera_right_optical: "zed_right_camera_optical_frame"
      imu: "zed_imu_link"
      lidar: "lidar_link"
      front_left_wheel: "front_left_wheel_link"
      front_right_wheel: "front_right_wheel_link"
      rear_left_wheel: "rear_left_wheel_link"
      rear_right_wheel: "rear_right_wheel_link"

frame_ids_to_remap: ["odom", "base_link"]
topics_to_remap:
  - "/camera_info"
  - "/depth"
  - "/drive"
  - "/imu"
  - "/odom"
  - "/point_cloud"
  - "/rgb"

keyboard_control_settings:
  max_speed_m_s: 3.0
  max_steer_rad: 0.8
  acceleration_m_s2: 6.0
  deceleration_m_s2: 8.0
  steering_speed_rad_s: 3.0

follow_camera:
  distance: 4.5
  height: 1.5
  focus_height: 0.8

gnss:
  enabled: true
  publish_rate_hz: 10
  map_origin:
    latitude: 48.812778
    longitude: 2.210278
    altitude: 0.0
  noise:
    horizontal_stddev_m: 0.5
    altitude_stddev_m: 1.0

semantic_segmentation:
  enabled: false
